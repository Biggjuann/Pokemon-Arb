# Railway build plan. Pinned so the build does not drift with the base image.
providers = ["python"]

[variables]
NIXPACKS_PYTHON_VERSION = "3.11"
PYTHONUNBUFFERED = "1"
PIP_DISABLE_PIP_VERSION_CHECK = "1"

[phases.install]
cmds = ["python -m pip install --upgrade pip", "pip install ."]

[start]
cmd = "pokearb serve"
